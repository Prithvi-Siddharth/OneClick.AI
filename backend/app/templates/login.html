{% extends "base.html" %}

{% block title %}Login - OneClick.AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-project-diagram"></i>
                OneClick.AI
            </div>
            <h3>Login to Your Account</h3>
        </div>

        <form method="post" action="/login">
            <div class="form-group" style="text-align: left;">
                <label for="email" class="form-label">Email Address</label>
                <div style="position: relative;">
                    <i class="fas fa-user" style="position: absolute; left: 10px; top: 12px; color: #aaa;"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"
                        style="padding-left: 35px;" required>
                </div>
            </div>

            <div class="form-group" style="text-align: left;">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 10px; top: 12px; color: #aaa;"></i>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter your password" style="padding-left: 35px; padding-right: 40px;" required>
                    <i class="fas fa-eye" id="togglePassword"
                        style="position: absolute; right: 10px; top: 12px; color: #aaa; cursor: pointer;"></i>
                </div>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </div>
        </form>

        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 10px;">
            <label>
                <input type="checkbox" name="remember"> Remember me
            </label>
            <a href="#">Forgot password?</a>
        </div>

        <div style="margin-top: 20px; font-size: 0.9rem;">
            New to OneClick.AI? <a href="/register">Sign Up</a>
        </div>

        {% if error %}
        <div class="alert alert-error" style="margin-top: 20px;">
            {{ error }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    togglePassword.addEventListener('click', function (e) {
        // toggle the type attribute
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        // toggle the eye slash icon
        this.classList.toggle('fa-eye-slash');
    });
</script>
{% endblock %}
