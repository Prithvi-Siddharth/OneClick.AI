{% extends "base.html" %}

{% block title %}Login - OneClick.AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; color: var(--accent); margin-bottom: 1rem;">
                <i class="fas fa-project-diagram"></i>
            </div>
            <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-primary);">Login to Your Account</h2>
            <p style="color: var(--text-secondary);">Welcome back to OneClick.AI</p>
        </div>

        <form method="post" action="/login">
            <div class="form-group" style="text-align: left;">
                <label for="email" class="form-label">Email Address</label>
                <div style="position: relative;">
                    <i class="fas fa-user" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com"
                        style="padding-left: 42px;" required>
                </div>
            </div>

            <div class="form-group" style="text-align: left;">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="••••••••" style="padding-left: 42px; padding-right: 42px;" required>
                    <i class="fas fa-eye" id="togglePassword"
                        style="position: absolute; right: 14px; top: 14px; color: var(--text-muted); cursor: pointer; transition: color 0.2s;"></i>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; font-size: 0.9rem;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-secondary);">
                    <input type="checkbox" name="remember" style="width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border);"> 
                    Remember me
                </label>
                <a href="#" style="color: var(--accent);">Forgot password?</a>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">Login</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 2rem; font-size: 0.95rem; color: var(--text-secondary);">
            New to OneClick.AI? <a href="/register" style="color: var(--accent); font-weight: 600;">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    if (togglePassword && password) {
        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
            this.style.color = this.classList.contains('fa-eye-slash') ? 'var(--accent)' : 'var(--text-muted)';
        });
    }
</script>
{% endblock %}
