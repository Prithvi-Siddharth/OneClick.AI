{% extends "base.html" %}

{% block title %}Register - OneClick.AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; color: var(--accent); margin-bottom: 1rem;">
                <i class="fas fa-project-diagram"></i>
            </div>
            <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-primary);">Create an Account</h2>
            <p style="color: var(--text-secondary);">Start building your AI application today</p>
        </div>

        <form action="/register" method="POST" autocomplete="on">
            <div class="form-group" style="text-align: left;">
                <label for="username" class="form-label">Username</label>
                <div style="position: relative;">
                    <i class="fas fa-user-circle" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);"></i>
                    <input type="text" id="username" name="username" class="form-control"
                        placeholder="Choose a username" style="padding-left: 42px;" required>
                </div>
            </div>

            <div class="form-group" style="text-align: left;">
                <label for="email" class="form-label">Email Address</label>
                <div style="position: relative;">
                    <i class="fas fa-envelope" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com"
                        style="padding-left: 42px;" required>
                </div>
            </div>

            <div class="form-group" style="text-align: left;">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="••••••••" style="padding-left: 42px; padding-right: 42px;" required>
                    <i class="fas fa-eye" id="togglePassword"
                        style="position: absolute; right: 14px; top: 14px; color: var(--text-muted); cursor: pointer; transition: color 0.2s;"></i>
                </div>
                <div style="margin-top: 8px; font-size: 0.8rem; color: var(--text-muted);">
                    Must be at least 8 characters long.
                </div>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">Register</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 2rem; font-size: 0.95rem; color: var(--text-secondary);">
            Already have an account? <a href="/login" style="color: var(--accent); font-weight: 600;">Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    if (togglePassword && password) {
        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
            this.style.color = this.classList.contains('fa-eye-slash') ? 'var(--accent)' : 'var(--text-muted)';
        });
    }
</script>
{% endblock %}
