<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
</head>

<body class="page page--register">

    <main class="main main--register">
        <section class="register register--section">

            <header class="register__header">
                <h1 class="register__title">Create Account</h1>
                <p class="register__subtitle">Fill the details to register</p>
            </header>

            <!--
            when the endpoint given in the backend is post, the action is performed according to the backend
            -->
            <form class="register__form" action="/register" method="POST" autocomplete="on">

                <!--
                the message is passed from the backend if the registration is successful
                -->
                {% if message %}
                <div
                    style="color: green; margin-bottom: 20px; padding: 10px; background-color: #f0f0f0; border-radius: 4px;">
                    {{ message }}
                </div>
                {% endif %}

                <!--
                the error is passed from the backend if the registration fails
                -->
                {% if error %}
                <div
                    style="color: red; margin-bottom: 20px; padding: 10px; background-color: #f0f0f0; border-radius: 4px;">
                    {{ error }}
                </div>
                {% endif %}

                <!-- Username -->
                <div class="form__group form__group--username">
                    <label class="form__label form__label--username" for="username">Username</label>
                    <!--
                    the name is the variable where the data is stored(the data typed here is stored in the name variable)
                    -->
                    <input class="form__input form__input--username" type="text" id="username" name="username"
                        placeholder="Choose a username" required />
                </div>

                <!-- Email -->
                <div class="form__group form__group--email">
                    <label class="form__label form__label--email" for="email">Email</label>
                    <input class="form__input form__input--email" type="email" id="email" name="email"
                        placeholder="Enter your email" required />
                </div>

                <!-- Password -->
                <div class="form__group form__group--password">
                    <label class="form__label form__label--password" for="password">Password</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input class="form__input form__input--password" type="password" id="password" name="password"
                            placeholder="Create a password" required />
                        <button type="button" onclick="togglePasswordVisibility('password')"
                            style="padding: 5px 10px; background-color: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer;">
                            Show
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <div class="form__group form__group--submit">
                    <button class="form__button form__button--submit" type="submit">
                        Register
                    </button>
                </div>

                <!-- Login Redirect -->
                <footer class="register__footer">
                    <p class="register__text register__text--login">
                        Already have an account?
                        <a class="register__link register__link--login" href="/login">Login</a>
                    </p>
                </footer>

            </form>
        </section>
    </main>

    <!--
    this method is to hide and show the password
    -->
    <script>
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            const button = event.target;
            if (field.type === 'password') {
                field.type = 'text';
                button.textContent = 'Hide';
            } else {
                field.type = 'password';
                button.textContent = 'Show';
            }
        }
    </script>

</body>

</html>
