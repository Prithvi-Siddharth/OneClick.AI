<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preprocess Your Data</title>
</head>

<body>
    <h1>Preprocess Your Data</h1>
    <p>Make your data AI-ready instantly</p>

    <!-- ✅ MISSING ELEMENTS ADDED -->
    <button id="openFilePickerBtn" type="button">Upload Dataset</button>
    <input id="fileInput" type="file" hidden />

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal-box">

            <button class="modal-close" id="closeModalBtn">&times;</button>

            <div class="modal-title">Upload Dataset</div>

            <form id="uploadForm" method="post" enctype="multipart/form-data" action="/temporary_upload_dataset">

                <div class="form-group">
                    <span class="label">Selected File</span>
                    <div class="file-info" id="selectedFileText">No file selected</div>
                </div>

                <div class="modal-actions">
                    <button class="btn-cancel" type="button" id="cancelBtn">Cancel</button>
                    <button class="btn-upload" type="submit">Upload</button>
                </div>

                <div class="status-text" id="statusText"></div>

            </form>

        </div>

    </div>

    <button onclick="alert('Connect functionality to be implemented')">Connect Data from Catalog</button>
    <br><br>
    <button onclick="alert('Process functionality to be implemented')">Process</button>

    <script>
        const openFilePickerBtn = document.getElementById("openFilePickerBtn");
        const fileInput = document.getElementById("fileInput");

        const modalOverlay = document.getElementById("modalOverlay");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        const selectedFileText = document.getElementById("selectedFileText");

        const uploadForm = document.getElementById("uploadForm");
        const statusText = document.getElementById("statusText");

        let selectedFile = null;

        // Step 1: Click "Upload Dataset" -> open file picker
        openFilePickerBtn.addEventListener("click", () => {
            fileInput.click();
        });

        // Step 2: After file chosen -> show popup
        fileInput.addEventListener("change", () => {
            if (!fileInput.files || fileInput.files.length === 0) {
                return;
            }

            selectedFile = fileInput.files[0];

            selectedFileText.innerText = `File: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(2)} KB)`;

            statusText.innerText = "";

            // Open modal
            modalOverlay.style.display = "flex";
        });

        // Close modal functions
        function closeModal() {
            modalOverlay.style.display = "none";
            statusText.innerText = "";
            fileInput.value = ""; // reset file input
            selectedFile = null;
            selectedFileText.innerText = "No file selected";
        }

        closeModalBtn.addEventListener("click", closeModal);
        cancelBtn.addEventListener("click", closeModal);

        // Click outside popup closes modal
        modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // Step 3: Upload form submit -> send to backend
        uploadForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!selectedFile) {
                statusText.innerText = "No file selected.";
                return;
            }

            statusText.innerText = "Uploading...";

            // FormData = multipart/form-data
            const formData = new FormData();
            formData.append("dataset_file", selectedFile);

            try {
                const response = await fetch("/temporary_upload_dataset", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.text();
                    statusText.innerText = "Upload failed: " + err;
                    return;
                }

                await response.json();
                statusText.innerText = "Uploaded successfully!";

                // Optional: close modal after 1 sec
                setTimeout(() => {
                    closeModal();
                    location.reload();
                }, 1000);

            } catch (error) {
                statusText.innerText = "Error uploading file.";
            }
        });
    </script>
</body>

</html>
