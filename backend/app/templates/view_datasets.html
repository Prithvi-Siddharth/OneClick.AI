<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Datasets</title>
</head>

<body>
    <nav>
        <a href="/dashboard">Dashboard</a>
    </nav>
    <h1>Welcome {{ username }}</h1>
    <h2>View Datasets</h2>
    <ul>
        {% for dataset in datasets %}
        <li>
            {{ dataset.filename }} Uploaded: {{ dataset.upload_date.strftime('%Y-%m-%d') }}
            <!-- Using dynamic IDs for reference if needed, but class based selection is better -->
            <button id="viewButton{{ dataset.id }}">View</button>
            <button id="deleteButton{{ dataset.id }}">Delete</button>
            <button id="downloadButton{{ dataset.id }}">Download</button>
        </li>
        {% endfor %}
    </ul>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="closeModal">&times;</button>
            <h2>Dataset Preview</h2>
            <div id="datasetPreview" style="overflow-x: auto;">
                <!-- Table will be injected here -->
            </div>
        </div>
    </div>

    <script>
        // takes the elements from the HTML
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModal = document.getElementById('closeModal');
        const datasetPreview = document.getElementById('datasetPreview');

        // Close modal logic
        closeModal.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
        });

        //if clicked anywhere other than the popup, the popup closes 
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.style.display = 'none';
            }
        });

        //view button logic
        document.querySelectorAll('button[id^="viewButton"]').forEach(btn => { // this selects all buttons that start with id viewButton
            btn.addEventListener('click', async function () { //this attaches an event listener to each button
                const datasetId = this.id.replace('viewButton', ''); //this get the dataset id from the button id

                datasetPreview.innerHTML = "<p>Loading preview...</p>";
                modalOverlay.style.display = 'flex';
                try {
                    //fetches the data from the new endpoint
                    const response = await fetch(`/preview_dataset/${datasetId}`);
                    if (!response.ok) {
                        throw new Error("Failed to load data");
                    }

                    const result = await response.json();
                    const data = result.data_preview; //this is the data preview
                    const stats = result.stats;

                    if (!data || data.length === 0) {
                        datasetPreview.innerHTML = "<p>No data found.</p>";
                        return;
                    }

                    //the table is print dynamically
                    let tableHtml = `<p><strong>Total Rows in Dataset:</strong> ${stats.total_rows}</p>`;
                    tableHtml += '<table border="1" cellpadding="5" cellspacing="0" style="width:100%; border-collapse: collapse;">';

                    //headers of the table
                    const headers = Object.keys(data[0]);
                    tableHtml += '<thead><tr>';
                    headers.forEach(h => {
                        tableHtml += `<th style="background:#f4f4f4;">${h}</th>`;
                    });
                    tableHtml += '</tr></thead>';
                    // Body
                    tableHtml += '<tbody>';
                    data.forEach(row => {
                        tableHtml += '<tr>';
                        headers.forEach(h => {
                            tableHtml += `<td>${row[h]}</td>`;
                        });
                        tableHtml += '</tr>';
                    });
                    tableHtml += '</tbody></table>';
                    datasetPreview.innerHTML = tableHtml;
                } catch (error) {
                    datasetPreview.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
                }
            });
        });

        //delete button logic
        document.querySelectorAll('button[id^="deleteButton"]').forEach(btn => { //this selects all buttons that start with id deleteButton
            btn.addEventListener('click', async function () {
                const datasetId = this.id.replace('deleteButton', ''); //this gets the dataset id from the button id
                try {
                    const response = await fetch(`/delete_dataset/${datasetId}`, {
                        method: 'DELETE'
                    });
                    if (!response.ok) {
                        throw new Error("Failed to delete dataset");
                    }
                    location.reload();
                } catch (error) {
                    alert(`Error deleting dataset: ${error.message}`);
                }
            });
        });

        //download button logic
        document.querySelectorAll('button[id^="downloadButton"]').forEach(btn => { //this selects all buttons that start with id downloadButton
            btn.addEventListener('click', async function () {
                const datasetId = this.id.replace('downloadButton', ''); //this gets the dataset id from the button id
                try {
                    const response = await fetch(`/download_dataset/${datasetId}`, {
                        method: 'GET'
                    });
                    if (!response.ok) {
                        throw new Error("Failed to get download URL");
                    }
                    const data = await response.json();

                    if (data.download_url) {
                        const a = document.createElement('a');
                        a.href = data.download_url; //taken the download_url from the backend
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    } else {
                        throw new Error("Download URL not found in response");
                    }
                } catch (error) {
                    alert(`Error downloading dataset: ${error.message}`);
                }
            });
        });
    </script>

</body>


</html>
