<script>
    // Detect the current protocol (ws or wss) and host automatically
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}/preprocess-dataset/ws`);

    socket.onopen = () => {
        console.log("✅ WebSocket connected");
        // Request initial preview immediately upon connection
        socket.send(JSON.stringify({ action: "get_preview" }));
    };

    socket.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);

            if (data.type === "status") {
                document.getElementById("status-text").textContent = data.message;
            } else if (data.type === "progress") {
                updateProgress(data.percentage, data.message);
            } else if (data.type === "preview") {
                renderPreview(data.data_preview);
                if (data.columns) {
                    renderAttributePanel(data.columns);
                }
                document.getElementById("preview-loading").style.display = "none";
                // Optionally hide progress after some delay
                setTimeout(() => {
                    if (document.getElementById("progress-percentage").textContent === "100%") {
                        // document.getElementById("progress-wrapper").style.display = "none";
                    }
                }, 3000);
            } else if (data.type === "error") {
                if (data.message && (data.message.includes("is not numeric") || data.message.includes("is not categorical"))) {
                    alert("Did your data school forget to teach variable types? Stick to counting colors—maybe you'll get that kindergarten diploma.");
                } else {
                    alert("❌ Error: " + data.message);
                }
                document.getElementById("preview-loading").style.display = "none";
            }
        } catch (e) {
            console.error("Error parsing message:", e);
        }
    };

    function updateProgress(percent, message) {
        const wrapper = document.getElementById("progress-wrapper");
        const bar = document.getElementById("progress-bar");
        const percentageText = document.getElementById("progress-percentage");
        const statusText = document.getElementById("status-text");

        wrapper.style.display = "block";
        bar.style.width = percent + "%";
        percentageText.textContent = percent + "%";
        if (message) {
            statusText.textContent = message;
        }
    }

    socket.onerror = (error) => {
        console.error("WebSocket error:", error);
    };

    socket.onclose = () => {
        console.log("❌ WebSocket closed");
    };

    function toggleAccordion(id) {
        const item = document.getElementById(id);
        const isOpen = item.classList.contains('active');

        // Independent toggle logic
        if (isOpen) {
            item.classList.remove('active');
        } else {
            item.classList.add('active');
        }
    }

    // Expand the first section by default
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const firstSection = document.getElementById('section-attributes');
            if (firstSection) firstSection.classList.add('active');
        }, 300);
    });

    function resetRadioButtons() {
        // Reset all radio button groups after preprocessing
        const radioGroups = [
            'drop_columns',
            'missing_values',
            'outliers',
            'encoding',
            'scaling',
            'transformations',
            'feature_selection',
            'data_reduction',
            'imbalanced_data'
        ];

        radioGroups.forEach(groupName => {
            const checked = document.querySelector(`input[name="${groupName}"]:checked`);
            if (checked) checked.checked = false;
        });
    }

    function applyPreprocessing() {
        // Find all selected attributes
        const selectedAttrEls = document.querySelectorAll('input[name="attribute-select"]:checked');
        const checkedRadios = document.querySelectorAll('input[type="radio"]:checked');

        if (selectedAttrEls.length === 0 && checkedRadios.length === 0) {
            alert("Please select at least one attribute and an operation!");
            return;
        } else if (selectedAttrEls.length === 0) {
            alert("Please select at least one attribute!");
            return;
        } else if (checkedRadios.length === 0) {
            alert("Please select at least one operation!");
            return;
        }

        const attributes = Array.from(selectedAttrEls).map(el => el.value);
        const selectedOps = {};

        // Define all preprocessing options from Step 2 to 10
        const steps = {
            drop_columns: ['drop_attr', 'remove_duplicates'],
            missing_values: ['mean', 'median', 'mode', 'constant', 'drop_rows', 'knn'],
            outliers: ['iqr', 'zscore', 'replace_constant'],
            encoding: ['onehot', 'label', 'target', 'freq', 'ordinal'],
            scaling: ['minmax', 'zscore_scale', 'robust', 'maxabs', 'standard'],
            transformations: ['log', 'sqrt', 'reciprocal', 'boxcox', 'yeojohnson', 'discretization', 'binning'],
            feature_selection: ['low_variance', 'kbest', 'tree_importance'],
            data_reduction: ['pca', 'lda', 'ica'],
            imbalanced_data: ['smote', 'class_weights']
        };

        // Populate selectedOps with checked values
        Object.keys(steps).forEach(stepKey => {
            const stepOps = steps[stepKey];
            stepOps.forEach(opId => {
                const el = document.getElementById(opId);
                if (el && el.checked) {
                    // Store the specific operation within its step category
                    if (!selectedOps[stepKey]) selectedOps[stepKey] = [];
                    selectedOps[stepKey].push(opId);
                }
            });
        });

        // Client-side Validation: Check if numeric operations are applied to non-numeric attributes
        const numericSteps = ['outliers', 'scaling', 'transformations'];
        const hasNumericOp = numericSteps.some(step => selectedOps[step] && selectedOps[step].length > 0);

        if (hasNumericOp) {
            const nonNumericFound = Array.from(selectedAttrEls).some(el => {
                const dtype = el.getAttribute('data-dtype');
                return dtype !== 'int' && dtype !== 'float';
            });
            if (nonNumericFound) {
                alert("Did your data school forget to teach variable types? Stick to counting colors—maybe you'll get that kindergarten diploma.");
                return;
            }
        }

        // Client-side Validation: Check if encoding (categorical) operations are applied to numeric attributes
        if (selectedOps['encoding'] && selectedOps['encoding'].length > 0) {
            const numericFound = Array.from(selectedAttrEls).some(el => {
                const dtype = el.getAttribute('data-dtype');
                return dtype === 'int' || dtype === 'float';
            });
            if (numericFound) {
                alert("Did your data school forget to teach variable types? Stick to counting colors—maybe you'll get that kindergarten diploma.");
                return;
            }
        }

        // Only show loading and progress AFTER validation
        document.getElementById("preview-loading").style.display = "block";
        document.getElementById("status-display").style.display = "block";
        updateProgress(0, "📡 Sending request...");

        socket.send(JSON.stringify({
            action: "apply_preprocessing",
            attributes: attributes, // Send the list of attributes
            operations: selectedOps
        }));

        resetRadioButtons();
    }

    function renderPreview(data) {
        const container = document.getElementById("preview-container");
        if (!data || data.length === 0) {
            container.innerHTML = '<p style="color: var(--text-secondary);">No data to display.</p>';
            return;
        }

        let html = '<table class="interactive-preview">';
        const headers = Object.keys(data[0]);

        html += '<thead><tr>';
        headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr></thead>';

        html += '<tbody>';
        data.forEach(row => {
            html += '<tr>';
            headers.forEach(h => html += `<td>${row[h] ?? ''}</td>`);
            html += '</tr>';
        });
        html += '</tbody></table>';

        container.innerHTML = html;
    }

    function renderAttributePanel(columns) {
        const grid = document.querySelector('#section-attributes .preprocess-grid');
        if (!grid) return;

        // Remember which attributes were checked so selections survive re-render
        const previouslyChecked = new Set(
            [...document.querySelectorAll('.attribute-radio:checked')].map(el => el.value)
        );

        grid.innerHTML = '';

        columns.forEach(({ name, dtype }) => {
            // Shorten pandas dtype to readable label
            const dtypeLabel = dtype.startsWith('int') ? 'int'
                : dtype.startsWith('float') ? 'float'
                    : dtype === 'bool' ? 'bool'
                        : dtype.startsWith('datetime') ? 'datetime'
                            : 'object';

            const card = document.createElement('div');
            card.className = 'preprocess-card';
            card.innerHTML = `
                <input type="checkbox"
                       name="attribute-select"
                       class="attribute-radio"
                       value="${name}"
                       data-dtype="${dtypeLabel}"
                       id="attr_${CSS.escape(name)}" />
                <label for="attr_${CSS.escape(name)}">
                    <h3 title="${name}">${name}</h3>
                    <p>${dtypeLabel}</p>
                </label>
                <div class="info-tooltip">Select this attribute for the next preprocessing steps.</div>
            `;

            // Restore checked state — dropped columns won't exist in columns so they naturally disappear
            if (previouslyChecked.has(name)) {
                card.querySelector('input[type="checkbox"]').checked = true;
            }

            grid.appendChild(card);
        });
    }


</script>
