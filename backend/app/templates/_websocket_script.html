<script>
    // Detect the current protocol (ws or wss) and host automatically
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    let socket;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;

    function connectWebSocket() {
        console.log("Connecting to WebSocket...");
        socket = new WebSocket(`${protocol}//${window.location.host}/preprocess-dataset/ws`);

        socket.onopen = () => {
            console.log("WebSocket connected");
            reconnectAttempts = 0;
            // Request initial preview immediately upon connection
            socket.send(JSON.stringify({ action: "get_preview" }));
        };

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                if (data.type === "status") {
                    document.getElementById("status-text").textContent = data.message;
                } else if (data.type === "query_results") {
                    renderQueryResults(data.data);
                    document.getElementById('query-results-loading').style.display = 'none';
                    document.getElementById('query-results-wrapper').style.display = 'block';
                    document.getElementById('run-query-btn').disabled = false;
                } else if (data.type === "progress") {
                    updateProgress(data.percentage, data.message);
                } else if (data.type === "preview") {
                    renderPreview(data.data_preview);
                    if (data.columns) {
                        renderAttributePanel(data.columns);
                    }
                    document.getElementById("preview-loading").style.display = "none";
                    setTimeout(() => {
                        if (document.getElementById("progress-percentage").textContent === "100%") {
                            // document.getElementById("progress-wrapper").style.display = "none";
                        }
                    }, 3000);
                } else if (data.type === "visualization_result") {
                    document.getElementById('viz-generate-btn').disabled = false;
                    document.getElementById('viz-generate-btn').innerHTML = '<i class="fas fa-play" style="margin-right:8px;"></i>Generate';
                    if (data.plot_data && data.plot_data.error) {
                        alert("Visualization Error: " + data.plot_data.error);
                    } else if (data.eda_stats && data.eda_stats.error) {
                        alert("EDA Error: " + data.eda_stats.error);
                    } else {
                        renderPlotlyChart(data.plot_data);
                        displayEDAStats(data.eda_stats);
                        document.getElementById('viz-export-btn').style.display = 'block';
                    }
                } else if (data.type === "error") {
                    // Check if error is from Query Tool
                    const queryLoading = document.getElementById('query-results-loading');
                    if (queryLoading && queryLoading.style.display === 'block') {
                        document.getElementById('query-results-loading').style.display = 'none';
                        document.getElementById('run-query-btn').disabled = false;
                        document.getElementById('query-status-text').textContent = "Error in SQL";
                        alert("SQL Error: " + data.message);
                    } else if (data.message && (data.message.includes("is not numeric") || data.message.includes("is not categorical"))) {
                        alert("Did your data school forget to teach variable types? Stick to counting colors—maybe you'll get that kindergarten diploma.");
                        resetRadioButtons();
                    } else {
                        alert("Error: " + data.message);
                    }
                    document.getElementById("preview-loading").style.display = "none";
                    document.getElementById("status-display").style.display = "none";
                    document.getElementById("progress-wrapper").style.display = "none";
                }
            } catch (e) {
                console.error("Error parsing message:", e);
            }
        };

        socket.onerror = (error) => {
            console.error("WebSocket error:", error);
        };

        socket.onclose = () => {
            console.log("WebSocket closed");
            if (reconnectAttempts < maxReconnectAttempts) {
                const delay = Math.pow(2, reconnectAttempts) * 1000;
                console.log(`Reconnecting in ${delay}ms... (Attempt ${reconnectAttempts + 1}/${maxReconnectAttempts})`);
                setTimeout(connectWebSocket, delay);
                reconnectAttempts++;
            } else {
                console.error("Max reconnection attempts reached.");
                alert("Connection lost. Please refresh the page.");
            }
        };
    }

    // Initial connection
    connectWebSocket();


    function updateProgress(percent, message) {
        const wrapper = document.getElementById("progress-wrapper");
        const bar = document.getElementById("progress-bar");
        const percentageText = document.getElementById("progress-percentage");
        const statusText = document.getElementById("status-text");

        wrapper.style.display = "block";
        bar.style.width = percent + "%";
        percentageText.textContent = percent + "%";
        if (message) {
            statusText.textContent = message;
        }
    }


    function toggleAccordion(id) {
        const item = document.getElementById(id);
        const isOpen = item.classList.contains('active');

        // Independent toggle logic
        if (isOpen) {
            item.classList.remove('active');
        } else {
            item.classList.add('active');
        }
    }

    // Expand the first section by default
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const firstSection = document.getElementById('section-attributes');
            if (firstSection) firstSection.classList.add('active');
        }, 300);
    });

    function resetRadioButtons() {
        // Reset all radio button groups after preprocessing
        const radioGroups = [
            'drop_columns',
            'missing_values',
            'outliers',
            'encoding',
            'scaling',
            'transformations',
            'feature_selection',
            'data_reduction',
            'imbalanced_data'
        ];

        radioGroups.forEach(groupName => {
            const checked = document.querySelector(`input[name="${groupName}"]:checked`);
            if (checked) checked.checked = false;
        });
    }

    function clearSectionSelections(sectionId) {
        const section = document.getElementById(sectionId);
        if (!section) return;

        const radios = section.querySelectorAll('input[type="radio"]');
        radios.forEach(radio => radio.checked = false);
    }

    function clearAttributeSelections() {
        const checkboxes = document.querySelectorAll('input[name="attribute-select"]');
        checkboxes.forEach(cb => cb.checked = false);
    }

    function applyPreprocessing() {
        // Find all selected attributes
        const selectedAttrEls = document.querySelectorAll('input[name="attribute-select"]:checked');
        const checkedRadios = document.querySelectorAll('input[type="radio"]:checked');

        if (selectedAttrEls.length === 0 && checkedRadios.length === 0) {
            alert("Please select at least one attribute and an operation!");
            return;
        } else if (selectedAttrEls.length === 0) {
            alert("Please select at least one attribute!");
            return;
        } else if (checkedRadios.length === 0) {
            alert("Please select at least one operation!");
            return;
        }

        const attributes = Array.from(selectedAttrEls).map(el => el.value);
        const selectedOps = {};

        // Define all preprocessing options from Step 2 to 10
        const steps = {
            drop_columns: ['drop_attr', 'remove_duplicates'],
            missing_values: ['mean', 'median', 'mode', 'constant', 'drop_rows', 'knn'],
            outliers: ['iqr', 'zscore', 'replace_constant'],
            encoding: ['onehot', 'label', 'target', 'freq', 'ordinal'],
            scaling: ['minmax', 'zscore_scale', 'robust', 'maxabs', 'standard'],
            transformations: ['log', 'sqrt', 'reciprocal', 'boxcox', 'yeojohnson', 'discretization', 'binning'],
            feature_selection: ['low_variance', 'kbest', 'tree_importance'],
            data_reduction: ['pca', 'lda', 'ica'],
            imbalanced_data: ['smote', 'class_weights']
        };

        // Populate selectedOps with checked values
        Object.keys(steps).forEach(stepKey => {
            const stepOps = steps[stepKey];
            stepOps.forEach(opId => {
                const el = document.getElementById(opId);
                if (el && el.checked) {
                    // Store the specific operation within its step category
                    if (!selectedOps[stepKey]) selectedOps[stepKey] = [];
                    selectedOps[stepKey].push(opId);
                }
            });
        });

        // Client-side Validation: Check if numeric operations are applied to non-numeric attributes
        const numericSteps = ['outliers', 'scaling', 'transformations'];
        const hasNumericOp = numericSteps.some(step => selectedOps[step] && selectedOps[step].length > 0);

        if (hasNumericOp) {
            const nonNumericFound = Array.from(selectedAttrEls).some(el => {
                const dtype = el.getAttribute('data-dtype');
                return dtype !== 'int' && dtype !== 'float';
            });
            if (nonNumericFound) {
                alert("Did your data school forget to teach variable types? Stick to counting colors—maybe you'll get that kindergarten diploma.");
                return;
            }
        }

        // Client-side Validation: Check if encoding (categorical) operations are applied to numeric attributes
        if (selectedOps['encoding'] && selectedOps['encoding'].length > 0) {
            const numericFound = Array.from(selectedAttrEls).some(el => {
                const dtype = el.getAttribute('data-dtype');
                return dtype === 'int' || dtype === 'float';
            });
            if (numericFound) {
                alert("Did your data school forget to teach variable types? Stick to counting colors—maybe you'll get that kindergarten diploma.");
                return;
            }
        }

        // Client-side Validation: Check if target-dependent operations are selected without a target column
        const targetDependentOps = {
            'encoding': ['target'],
            'feature_selection': ['kbest'],
            'data_reduction': ['lda'],
            'imbalanced_data': ['smote', 'class_weights']
        };
        const targetOpNames = {
            'target': 'Target Encoding',
            'kbest': 'Select k-best',
            'lda': 'LDA',
            'smote': 'SMOTE',
            'class_weights': 'Class Weights'
        };

        let missingTargetOp = null;
        outer: for (const [step, ops] of Object.entries(targetDependentOps)) {
            if (selectedOps[step]) {
                for (const op of ops) {
                    if (selectedOps[step].includes(op)) {
                        missingTargetOp = targetOpNames[op];
                        break outer;
                    }
                }
            }
        }

        if (missingTargetOp && !selectedTargetColumn) {
            alert(
                `"${missingTargetOp}" requires a target column.\n\n` +
                `Please open Section 0 (Select Target Column), pick the column your model should predict, ` +
                `and click "Save Target Column" before applying this step.`
            );
            // Scroll to and highlight the target column section
            const targetSection = document.getElementById('section-target-column');
            if (targetSection) {
                targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                targetSection.classList.add('active');
            }
            return;
        }

        // Only show loading and progress AFTER validation
        document.getElementById("preview-loading").style.display = "block";
        document.getElementById("status-display").style.display = "block";
        updateProgress(0, " Sending request...");

        socket.send(JSON.stringify({
            action: "apply_preprocessing",
            attributes: attributes, // Send the list of attributes
            operations: selectedOps,
            target_column: selectedTargetColumn  // Send the selected target column
        }));

        addLogEntry(selectedOps, attributes);
        resetRadioButtons();
    }

    function renderPreview(data) {
        const container = document.getElementById("preview-container");
        if (!data || data.length === 0) {
            container.innerHTML = '<p style="color: var(--text-secondary);">No data to display.</p>';
            return;
        }

        let html = '<table class="interactive-preview">';
        const headers = Object.keys(data[0]);

        html += '<thead><tr>';
        headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr></thead>';

        html += '<tbody>';
        data.forEach(row => {
            html += '<tr>';
            headers.forEach(h => html += `<td>${row[h] ?? ''}</td>`);
            html += '</tr>';
        });
        html += '</tbody></table>';

        container.innerHTML = html;
    }

    function renderAttributePanel(columns) {
        const grid = document.querySelector('#section-attributes .preprocess-grid');
        if (!grid) return;

        // Remember which attributes were checked so selections survive re-render
        const previouslyChecked = new Set(
            [...document.querySelectorAll('.attribute-radio:checked')].map(el => el.value)
        );

        grid.innerHTML = '';

        columns.forEach(({ name, dtype }) => {
            // Shorten pandas dtype to readable label
            const dtypeLabel = dtype.startsWith('int') ? 'int'
                : dtype.startsWith('float') ? 'float'
                    : dtype === 'bool' ? 'bool'
                        : dtype.startsWith('datetime') ? 'datetime'
                            : 'object';

            const card = document.createElement('div');
            card.className = 'preprocess-card';
            card.innerHTML = `
                <input type="checkbox"
                       name="attribute-select"
                       class="attribute-radio"
                       value="${name}"
                       data-dtype="${dtypeLabel}"
                       id="attr_${CSS.escape(name)}" />
                <label for="attr_${CSS.escape(name)}">
                    <h3 title="${name}">${name}</h3>
                    <p>${dtypeLabel}</p>
                </label>
                <div class="info-tooltip">Select this attribute for the next preprocessing steps.</div>
            `;

            // Restore checked state — dropped columns won't exist in columns so they naturally disappear
            if (previouslyChecked.has(name)) {
                card.querySelector('input[type="checkbox"]').checked = true;
            }

            grid.appendChild(card);
        });
    }

    async function downloadDataset(id) {
        if (!id) {
            alert("Dataset ID not found!");
            return;
        }

        try {
            const response = await fetch("/download_preprocessed_dataset/" + id);
            const data = await response.json();

            if (data.download_url) {
                window.location.href = data.download_url;
            } else if (data.error) {
                alert("Error: " + data.error);
            }
        } catch (error) {
            console.error("Download failed:", error);
            alert("Failed to initiate download.");
        }
    }

    async function saveDatasetToCatalog() {
        document.getElementById("preview-loading").style.display = "block";
        try {
            const response = await fetch('/save_preprocessed_dataset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            const data = await response.json();
            if (response.ok) {
                alert(data.message);
                window.location.href = "/view_datasets";
            } else {
                alert("Error: " + data.error);
            }
        } catch (error) {
            console.error("Save failed:", error);
            alert("Failed to save dataset.");
        } finally {
            document.getElementById("preview-loading").style.display = "none";
        }
    }

    function showHistory() {
        document.getElementById('activity-log-sidebar').classList.add('open');
        document.getElementById('sidebar-overlay').style.display = 'block';
    }

    function hideHistory() {
        document.getElementById('activity-log-sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').style.display = 'none';
    }

    // Close when clicking outside the sidebar
    document.addEventListener('click', (e) => {
        const sidebar = document.getElementById('activity-log-sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (e.target === overlay) {
            hideHistory();
        }
    });

    // ── Target Column State ───────────────────────────────────────────────────────
    let selectedTargetColumn = null;

    function saveTargetColumn() {
        const selected = document.querySelector('input[name="target_column"]:checked');
        if (!selected) {
            alert("Please select a target column first!");
            return;
        }
        selectedTargetColumn = selected.value;
        const statusEl = document.getElementById('target-column-status');
        statusEl.textContent = ` Target column set to: "${selectedTargetColumn}"`;
        statusEl.style.color = 'var(--primary-color)';
        statusEl.style.fontWeight = '600';
    }

    // ── Activity Log State ────────────────────────────────────────────────────────
    const activityLog = [];

    function addLogEntry(operations, attributes) {
        const timestamp = new Date().toLocaleTimeString();

        // Build a readable label for what was applied
        Object.entries(operations).forEach(([step, ops]) => {
            ops.forEach(op => {
                activityLog.unshift({           // unshift = newest first
                    step: step.replace(/_/g, ' '),
                    operation: op.replace(/_/g, ' '),
                    attributes: attributes,
                    timestamp
                });
            });
        });

        renderLogList();
    }

    function renderLogList() {
        const logList = document.getElementById('log-list');

        if (activityLog.length === 0) {
            logList.innerHTML = '<p style="color: #64748b; text-align: center; margin-top: 2rem;">No preprocessing steps applied yet.</p>';
            return;
        }

        logList.innerHTML = activityLog.map((entry, index) => `
            <div class="log-item">
                <div class="log-item-header">
                    <span>#${activityLog.length - index} &nbsp;|&nbsp; ${entry.step}</span>
                    <span class="log-item-time">${entry.timestamp}</span>
                </div>
                <div class="log-item-details">
                    Operation: <strong>${entry.operation}</strong>
                </div>
                <div class="log-item-attrs">
                    ${entry.attributes.join(', ')}
                </div>
            </div>
        `).join('');
    }

    async function saveDatasetToCatalog() {
        const customName = document.getElementById('custom-dataset-name').value;

        if (!customName) {
            alert("Please enter a name for your dataset first!");
            return;
        }

        document.getElementById("preview-loading").style.display = "block";
        try {
            const response = await fetch('/save_preprocessed_dataset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ custom_name: customName }) // Send the name to backend
            });

            const data = await response.json();
            if (response.ok) {
                alert(data.message);
                window.location.href = "/view_datasets"; // Go to Data Catalog
            } else {
                alert("Error: " + data.error);
            }
        } catch (error) {
            console.error("Save failed:", error);
            alert("Failed to save dataset.");
        } finally {
            document.getElementById("preview-loading").style.display = "none";
        }
    }


    // ── Query Tool Logic ──────────────────────────────────────────────────
    function showQueryTool() {
        document.getElementById('query-tool-panel').classList.add('open');
        document.getElementById('sidebar-overlay').style.display = 'block';
    }

    function hideQueryTool() {
        document.getElementById('query-tool-panel').classList.remove('open');
        document.getElementById('sidebar-overlay').style.display = 'none';
    }

    function runSqlQuery() {
        const query = document.getElementById('sql-query-input').value.trim();
        if (!query) {
            alert("Please enter a SQL query!");
            return;
        }

        const runBtn = document.getElementById('run-query-btn');
        const loading = document.getElementById('query-results-loading');
        const wrapper = document.getElementById('query-results-wrapper');
        const statusText = document.getElementById('query-status-text');

        runBtn.disabled = true;
        loading.style.display = 'block';
        wrapper.style.display = 'none';
        statusText.textContent = "Executing...";

        socket.send(JSON.stringify({
            action: "run_sql",
            query: query
        }));
    }

    // ── Visualization Tool Logic ──────────────────────────────────────────────

    function showVisualization() {
        document.getElementById('visualize-panel').classList.add('open');
        document.getElementById('sidebar-overlay').style.display = 'block';
    }

    function hideVisualization() {
        document.getElementById('visualize-panel').classList.remove('open');
        document.getElementById('sidebar-overlay').style.display = 'none';
    }

    function onChartTypeChange() {
        const chartType = document.getElementById('viz-chart-type').value;
        const attr2Row = document.getElementById('viz-attr2-row');
        if (chartType === 'scatter') {
            attr2Row.classList.remove('hidden');
        } else {
            attr2Row.classList.add('hidden');
        }
    }

    function generatePlot() {
        const col1 = document.getElementById('viz-attr1').value;
        const col2 = document.getElementById('viz-attr2').value;
        const plotType = document.getElementById('viz-chart-type').value;

        if (!col1) {
            alert("Please select Attribute 1.");
            return;
        }
        if (plotType === 'scatter' && !col2) {
            alert("Scatter plot requires Attribute 2.");
            return;
        }

        const btn = document.getElementById('viz-generate-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Generating...';

        document.getElementById('viz-stats-card').style.display = 'none';
        document.getElementById('viz-export-btn').style.display = 'none';

        socket.send(JSON.stringify({
            action: "get_visualization",
            col1: col1,
            col2: col2 || null,
            plot_type: plotType,
        }));
    }

    function renderPlotlyChart(plotData) {
        const container = document.getElementById('viz-plotly-chart');
        const isDark = document.documentElement.classList.contains('theme-dark') ||
            document.body.classList.contains('theme-dark');

        const paperBg = isDark ? '#1e2030' : '#ffffff';
        const plotBg = isDark ? '#1e2030' : '#ffffff';
        const fontColor = isDark ? '#cdd6f4' : '#1e293b';
        const gridColor = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
        const accentColor = '#6366f1';

        const layout = {
            paper_bgcolor: paperBg,
            plot_bgcolor: plotBg,
            font: { color: fontColor, family: 'Inter, sans-serif', size: 12 },
            margin: { t: 40, r: 20, b: 50, l: 55 },
            xaxis: { gridcolor: gridColor, zerolinecolor: gridColor, title: plotData.col1 },
            yaxis: { gridcolor: gridColor, zerolinecolor: gridColor },
            showlegend: false,
        };

        const config = { displayModeBar: false, responsive: true };

        let traces = [];

        if (plotData.plot_type === 'histogram') {
            traces = [{
                x: plotData.x,
                y: plotData.y,
                type: 'bar',
                marker: { color: accentColor, opacity: 0.85 },
                name: plotData.col1,
            }];
            layout.yaxis.title = 'Count';
        } else if (plotData.plot_type === 'box') {
            // Reconstruct box from pre-computed stats
            traces = [{
                type: 'box',
                name: plotData.col1,
                q1: [plotData.q1],
                median: [plotData.median],
                q3: [plotData.q3],
                lowerfence: [plotData.lower_fence],
                upperfence: [plotData.upper_fence],
                y: plotData.outliers,
                marker: { color: accentColor },
                boxpoints: plotData.outliers.length > 0 ? 'outliers' : false,
            }];
        } else if (plotData.plot_type === 'scatter') {
            traces = [{
                x: plotData.x,
                y: plotData.y,
                mode: 'markers',
                type: 'scatter',
                marker: { color: accentColor, opacity: 0.6, size: 5 },
                name: `${plotData.col1} vs ${plotData.col2}`,
            }];
            layout.xaxis.title = plotData.col1;
            layout.yaxis.title = plotData.col2;
        } else if (plotData.plot_type === 'bar') {
            traces = [{
                x: plotData.x,
                y: plotData.y,
                type: 'bar',
                marker: { color: accentColor, opacity: 0.85 },
                name: plotData.col1,
            }];
            layout.yaxis.title = 'Count';
        }

        Plotly.react(container, traces, layout, config);
    }

    function displayEDAStats(stats) {
        if (!stats || stats.error) return;

        const card = document.getElementById('viz-stats-card');
        const grid = document.getElementById('viz-stats-grid');
        const obs = document.getElementById('viz-observation');

        const statsToShow = [];

        statsToShow.push({ label: 'Total Rows', value: stats.total_count });
        statsToShow.push({ label: 'Null Count', value: `${stats.null_count} (${stats.null_percent}%)` });

        if (stats.is_numeric) {
            statsToShow.push({ label: 'Mean', value: stats.mean });
            statsToShow.push({ label: 'Median', value: stats.median });
            statsToShow.push({ label: 'Mode', value: stats.mode ?? 'N/A' });
            statsToShow.push({ label: 'Std Dev', value: stats.std });
            statsToShow.push({ label: 'Min', value: stats.min });
            statsToShow.push({ label: 'Max', value: stats.max });
            statsToShow.push({ label: 'Skewness', value: stats.skewness });
            statsToShow.push({ label: 'Kurtosis', value: stats.kurtosis });
            statsToShow.push({ label: 'IQR', value: stats.iqr });
            statsToShow.push({ label: 'Outliers (IQR)', value: stats.outlier_count });

            // Suggested Insight
            let insight = '';
            if (Math.abs(stats.skewness) > 1) {
                insight = `This data is highly skewed ${stats.skewness > 0 ? 'to the right (positive skew)' : 'to the left (negative skew)'}. Consider a log or Box-Cox transform.`;
            } else if (Math.abs(stats.skewness) > 0.5) {
                insight = `This data is moderately skewed. It may still benefit from a power transformation.`;
            } else {
                insight = `This data appears roughly symmetric (skewness ≈ ${stats.skewness}).`;
            }
            if (stats.null_percent > 10) {
                insight += `  ${stats.null_percent}% of values are null — consider imputation.`;
            }
            if (stats.outlier_count > 0) {
                insight += ` ${stats.outlier_count} IQR-based outlier(s) detected.`;
            }

            obs.textContent = insight;
            obs.style.display = 'block';
        } else {
            statsToShow.push({ label: 'Unique Values', value: stats.unique_count });
            statsToShow.push({ label: 'Top Value', value: stats.top_value ?? 'N/A' });
            statsToShow.push({ label: 'Top Count', value: stats.top_count });
            obs.style.display = 'none';
        }

        grid.innerHTML = statsToShow.map(s => `
            <div class="viz-stat-item">
                <div class="stat-label">${s.label}</div>
                <div class="stat-value">${s.value}</div>
            </div>
        `).join('');

        card.style.display = 'block';
    }

    function exportChart() {
        const container = document.getElementById('viz-plotly-chart');
        const col1 = document.getElementById('viz-attr1').value || 'chart';
        Plotly.downloadImage(container, {
            format: 'png',
            filename: `viz_${col1}`,
            width: 1200,
            height: 600,
        });
    }

    // ── Query Tool Logic ──────────────────────────────────────────────
    function renderQueryResults(data) {
        const thead = document.getElementById('query-results-thead');
        const tbody = document.getElementById('query-results-tbody');
        const rowCountEl = document.getElementById('query-row-count');
        const statusText = document.getElementById('query-status-text');

        thead.innerHTML = '';
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            statusText.textContent = "Results: No data found";
            rowCountEl.textContent = "0 rows";
            tbody.innerHTML = '<tr><td colspan="100%" style="text-align: center; padding: 3rem; color: #585b70;">No results to display.</td></tr>';
            return;
        }

        statusText.textContent = "Results";
        rowCountEl.textContent = `${data.length} rows found`;

        const headers = Object.keys(data[0]);
        let headerHtml = '<tr>';
        headers.forEach(h => headerHtml += `<th>${h}</th>`);
        headerHtml += '</tr>';
        thead.innerHTML = headerHtml;

        let bodyHtml = '';
        data.forEach(row => {
            bodyHtml += '<tr>';
            headers.forEach(h => {
                let val = row[h];
                if (val === null || val === undefined) val = '<span style="color: #45475a;">null</span>';
                bodyHtml += `<td>${val}</td>`;
            });
            bodyHtml += '</tr>';
        });
        tbody.innerHTML = bodyHtml;
    }


</script>
