<script>
    // Detect the current protocol (ws or wss) and host automatically
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}/preprocess-dataset/ws`);

    socket.onopen = () => {
        console.log("✅ WebSocket connected");
        // Request initial preview immediately upon connection
        socket.send(JSON.stringify({ action: "get_preview" }));
    };

    socket.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);

            if (data.type === "status") {
                document.getElementById("status-text").textContent = data.message;
            } else if (data.type === "progress") {
                updateProgress(data.percentage, data.message);
            } else if (data.type === "preview") {
                renderPreview(data.data_preview);
                document.getElementById("preview-loading").style.display = "none";
                // Optionally hide progress after some delay
                setTimeout(() => {
                    if (document.getElementById("progress-percentage").textContent === "100%") {
                        // document.getElementById("progress-wrapper").style.display = "none";
                    }
                }, 3000);
            }
        } catch (e) {
            console.error("Error parsing message:", e);
        }
    };

    function updateProgress(percent, message) {
        const wrapper = document.getElementById("progress-wrapper");
        const bar = document.getElementById("progress-bar");
        const percentageText = document.getElementById("progress-percentage");
        const statusText = document.getElementById("status-text");

        wrapper.style.display = "block";
        bar.style.width = percent + "%";
        percentageText.textContent = percent + "%";
        if (message) {
            statusText.textContent = message;
        }
    }

    socket.onerror = (error) => {
        console.error("WebSocket error:", error);
    };

    socket.onclose = () => {
        console.log("❌ WebSocket closed");
    };

    function toggleAccordion(id) {
        const item = document.getElementById(id);
        const isOpen = item.classList.contains('active');

        // Independent toggle logic
        if (isOpen) {
            item.classList.remove('active');
        } else {
            item.classList.add('active');
        }
    }

    // Expand the first section by default
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const firstSection = document.getElementById('section-attributes');
            if (firstSection) firstSection.classList.add('active');
        }, 300);
    });

    function applyPreprocessing() {
        document.getElementById("preview-loading").style.display = "block";

        // Find all selected attributes
        const selectedAttrEls = document.querySelectorAll('input[name="attribute-select"]:checked');
        if (selectedAttrEls.length === 0) {
            alert("Please select at least one attribute!");
            document.getElementById("preview-loading").style.display = "none";
            return;
        }

        const attributes = Array.from(selectedAttrEls).map(el => el.value);

        const selectedOps = {};
        ['onehot', 'label', 'target', 'minmax'].forEach(op => {
            const el = document.getElementById(op);
            if (el) selectedOps[op] = el.checked;
        });

        document.getElementById("status-display").style.display = "block";
        updateProgress(0, "📡 Sending request...");

        socket.send(JSON.stringify({
            action: "apply_preprocessing",
            attributes: attributes, // Send the list of attributes
            operations: selectedOps
        }));
    }

    function renderPreview(data) {
        const container = document.getElementById("preview-container");
        if (!data || data.length === 0) {
            container.innerHTML = '<p style="color: var(--text-secondary);">No data to display.</p>';
            return;
        }

        let html = '<table class="interactive-preview">';
        const headers = Object.keys(data[0]);

        html += '<thead><tr>';
        headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr></thead>';

        html += '<tbody>';
        data.forEach(row => {
            html += '<tr>';
            headers.forEach(h => html += `<td>${row[h] ?? ''}</td>`);
            html += '</tr>';
        });
        html += '</tbody></table>';

        container.innerHTML = html;
    }
</script>
